<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vagas1000 · Painel de vagas</title>
<style>
/*__FONTS__*/
/* Nevora Design System — tema escuro é a referência; o claro usa os mesmos tons, escurecidos para contraste AA. */
:root{
  color-scheme: dark;
  --surface:#0B0E19; --surface-2:#151A2B; --raised:#1C2238; --field:#0E121E;
  --border:#2C3142; --border-strong:#626B8D; --grid:#1C2238;
  --ink:#F4F6FF; --ink-2:#A6B1CB; --ink-3:#7D87A3;
  --accent:#9D8CFF; --accent-fg:#0B0E19; --accent-soft:#2A2652; --teal:#42D6CD;
  --ok:#45D6A0; --warn:#F5C66B; --danger:#FF718D;
  --v-elig:#9D8CFF; --v-maybe:#2F7F86; --v-block:#2C3142;
  --bar:#9D8CFF; --hl:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.45);
  --atmos:radial-gradient(1100px circle at 15% -5%,rgba(157,140,255,.045),transparent 65%),radial-gradient(900px circle at 85% 35%,rgba(66,214,205,.025),transparent 60%);
  --font-body:"Inter Nevora","Inter","Segoe UI",system-ui,sans-serif;
  --font-head:"Space Grotesk Nevora","Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono Nevora","JetBrains Mono",Consolas,monospace;
  --r-sm:10px; --r-md:14px; --r-lg:18px;
}
@media (prefers-color-scheme: light){
  :root:where(:not([data-theme="dark"])){
    color-scheme: light;
    --surface:#F6F7FC; --surface-2:#FFFFFF; --raised:#EEF0F8; --field:#FAFBFF;
    --border:#DDE1EE; --border-strong:#878EA6; --grid:#EEF0F8;
    --ink:#0B0E19; --ink-2:#525C78; --ink-3:#5F6985;
    --accent:#6C5CE7; --accent-fg:#FFFFFF; --accent-soft:#E6E2FD; --teal:#0A7A74;
    --ok:#128058; --warn:#9C6008; --danger:#CD2D50;
    --v-elig:#6C5CE7; --v-maybe:#0A7A74; --v-block:#C9CDDD;
    --bar:#6C5CE7; --hl:rgba(255,255,255,.9); --shadow:rgba(11,14,25,.08); --atmos:none;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --surface:#F6F7FC; --surface-2:#FFFFFF; --raised:#EEF0F8; --field:#FAFBFF;
  --border:#DDE1EE; --border-strong:#878EA6; --grid:#EEF0F8;
  --ink:#0B0E19; --ink-2:#525C78; --ink-3:#5F6985;
  --accent:#6C5CE7; --accent-fg:#FFFFFF; --accent-soft:#E6E2FD; --teal:#0A7A74;
  --ok:#128058; --warn:#9C6008; --danger:#CD2D50;
  --v-elig:#6C5CE7; --v-maybe:#0A7A74; --v-block:#C9CDDD;
  --bar:#6C5CE7; --hl:rgba(255,255,255,.9); --shadow:rgba(11,14,25,.08); --atmos:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;background-image:var(--atmos);background-attachment:fixed;min-height:100vh}
h1,h2,h3,.kpi b{font-family:var(--font-head)}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}
button,select,input{font:inherit;color:var(--ink)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 70px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);font-size:13px}
[hidden]{display:none!important}

/* ---------- botões e campos (raio 10, borda de 1px, brilho interno) ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;box-shadow:inset 0 1px 0 var(--hl),0 1px 2px var(--shadow);transition:border-color .15s,background .15s;font-weight:500}
.btn:hover{border-color:var(--ink-3);text-decoration:none}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));color:var(--accent-fg);border-color:color-mix(in srgb,var(--accent) 60%,#fff);font-weight:600}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:4px 10px;font-size:12.5px}
/* Contorno de componentes interativos: --border-strong (>= 3:1, WCAG 1.4.11); --border fica para cards e divisores. */
input[type=search],select,input[type=text]{background:var(--field);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:7px 11px;min-width:0}
input[type=search]:focus,select:focus{border-color:var(--accent)}
::placeholder{color:var(--ink-3);opacity:1}               /* o padrão do navegador some no campo escuro; o rótulo acessível está no aria-label */
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer;flex:none}
input[type=range]{height:24px;margin:0;accent-color:var(--accent);cursor:pointer}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;min-height:32px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed=true]{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--teal) 18%,transparent));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
h1{font-size:22px;margin:0;font-weight:500;letter-spacing:-.01em}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;box-shadow:inset 0 1px 0 var(--hl),0 2px 8px -2px var(--shadow)}
.kpi b{display:block;font-size:26px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--ink-2)}
.kpi.hot{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,var(--surface-2)),var(--surface-2))}
.kpi.hot b{color:var(--accent)}
.kpi-meta{margin:-6px 2px 14px;color:var(--ink-2);font-size:13px}

/* ---------- painéis recolhíveis ---------- */
/* Recolhidos, os três painéis são uma linha só (título + resumo) lado a lado; aberto, o painel ocupa a linha inteira. */
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px;align-items:start}
.panel[data-open="true"]{grid-column:1/-1}
@media(max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:inset 0 1px 0 var(--hl),0 1px 4px -1px var(--shadow);overflow:hidden}
.panel-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;cursor:pointer;min-height:42px}
.panel-h:hover{background:color-mix(in srgb,var(--raised) 55%,transparent)}
.panel-h h2{font-size:12px;font-weight:500;margin:0;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-mono);white-space:nowrap}
.panel-h .sum{margin-left:auto;color:var(--ink);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.panel-h .mini{display:flex;width:54px;height:6px;border-radius:999px;overflow:hidden;gap:1px;flex:none;background:var(--field)}
.panel-h .chev{transition:transform .2s;color:var(--ink-2);flex:none;width:18px;height:18px}
.panel[data-open="true"] .chev{transform:rotate(180deg)}
.panel-b{padding:2px 14px 14px}
.full{display:flex;flex-direction:column;gap:10px}
.scroll{max-height:min(38vh,300px);overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 35%,transparent) transparent}
.scroll::-webkit-scrollbar{width:8px} .scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1;min-width:160px}
.stat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--field);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.strip i{width:13px;height:13px;border-radius:5px;background:var(--ok);opacity:.85;display:block}
.strip i.zero{background:var(--v-block);opacity:1} .strip i.err{background:var(--danger);opacity:1}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.src{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--field);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;min-width:0}
.src b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .n{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none} .src.zero i{background:var(--v-block)} .src.err i{background:var(--danger)}
.src.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.src.nodata i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}   /* sem leitura: ponto oco, nunca o verde de "ok" */
.src .e{color:var(--danger);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.barrow{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px;border-radius:8px;padding:2px 4px}
.barrow.click{cursor:pointer} .barrow.click:hover{background:var(--raised)}
.barrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .num{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px}
.track{display:flex;height:10px;gap:2px;border-radius:999px;overflow:hidden;background:var(--field)}
.seg1{height:100%;min-width:2px} .single{height:100%;background:var(--bar);border-radius:999px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.dist{height:12px;display:flex;gap:2px;border-radius:999px;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);background:var(--field);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:default}
.pill b{font-family:var(--font-mono);font-weight:500;color:var(--ink-2);font-size:12px}
button.pill{cursor:pointer} button.pill:hover{border-color:var(--ink-3)}

/* ---------- abas (Vagas | LinkedIn) ---------- */
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--border)}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink);background:color-mix(in srgb,var(--raised) 55%,transparent)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--font-mono);font-size:12px;background:var(--field);border:1px solid var(--border);border-radius:999px;padding:0 8px;color:var(--ink-2)}
/* As abas Vagas / LinkedIn são do próprio painel e aparecem também dentro do app (a janela principal só tem Início e Painel). */
.li-note{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.li-table td.ttl{min-width:240px;max-width:460px} .li-table td.ttl b{font-weight:600} .li-table td.ttl div{color:var(--ink-3);font-size:12.5px}
.li-table td.ttl .obs1{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* observação em uma linha só; o resto na página da vaga */
.li-table td{font-size:13.5px}

/* ---------- filtros ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
.filters input[type=search]{min-width:230px}
.filters label{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;min-height:32px;cursor:pointer}
/* barra fixa no topo ao rolar a lista; os filtros avançados abrem num popover para não empurrar os cards */
.fbar{position:sticky;top:0;z-index:6;background:var(--surface);padding:8px 0 2px;margin:0 0 6px}
.fbar .filters{margin:0 0 6px}
.fbar .btn .n{font-family:var(--font-mono);font-size:12px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px;font-weight:600}
.adv{position:absolute;left:0;top:calc(100% - 4px);z-index:7;width:min(600px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 14px;align-items:center;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:14px;box-shadow:0 14px 34px -8px var(--shadow)}
.adv select{width:100%}
.adv .rng{gap:10px} .adv .rng input{flex:1;min-width:80px}
.adv .btn{justify-self:start}
.techs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.tg{border:1px solid var(--border-strong);background:var(--field);border-radius:999px;padding:3px 12px;min-height:32px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.tg[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-ELIGIBLE{background:color-mix(in srgb,var(--v-elig) 22%,transparent);border-color:color-mix(in srgb,var(--v-elig) 50%,transparent);color:var(--ink)}
.b-MAYBE{background:color-mix(in srgb,var(--teal) 14%,transparent);border-color:color-mix(in srgb,var(--teal) 40%,transparent);color:var(--teal)}
.b-BLOCKED{background:transparent;border-color:var(--border);color:var(--ink-3)}
.b-new{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.b-closed{background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.b-open{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.b-n{background:var(--field);border-color:var(--border);color:var(--ink-2);font-weight:500}

/* ---------- cards de vaga ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:inset 0 1px 0 var(--hl),0 2px 8px -2px var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;color:inherit;min-width:0}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:inset 0 1px 0 var(--hl),0 10px 24px -8px var(--shadow);text-decoration:none}
.card.closed .c-title,.card.closed .tile{opacity:.6}                 /* esmaecer o card inteiro derrubava o contraste dos metadados abaixo de 4,5:1 */
.c-top{display:flex;align-items:center;gap:10px}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:600 16px var(--font-head);color:var(--accent-fg);background:linear-gradient(135deg,var(--accent),var(--teal));flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tile.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.c-co{min-width:0;flex:1} .c-co b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .c-co span{font-size:12px;color:var(--ink-3)}
.score{font:500 15px var(--font-head);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--grid) 0);position:relative}
.score::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface-2)} .score span{position:relative}
.c-title{font:500 16.5px/1.3 var(--font-head);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink-2);font-size:13px}
.c-meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.c-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--border);background:var(--field);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2)}
.chip.sal{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--border))}
.c-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--grid)}
.c-foot .when{margin-left:auto;font-size:12px;color:var(--ink-3)}
.more{display:flex;justify-content:center;margin:18px 0}

/* ---------- tabela ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hl)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface-2)}
th[aria-sort=ascending]::after{content:" ▲"} th[aria-sort=descending]::after{content:" ▼"}
th[data-k]:hover,th[data-k]:focus-visible{color:var(--ink)}
th[data-k]:not([aria-sort]):hover::after,th[data-k]:not([aria-sort]):focus-visible::after{content:" ↕";opacity:.55}
tr.row{cursor:pointer} tr.row:hover td{background:var(--raised)}
td.sc{white-space:nowrap;font-variant-numeric:tabular-nums;width:92px}
.scbar{display:inline-block;height:8px;border-radius:999px;background:var(--bar);vertical-align:middle;margin-right:6px}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
details.hist summary{cursor:pointer;color:var(--ink-2);font-size:13px;margin:22px 0 8px}

/* ---------- página da vaga ---------- */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.crumbs .sp{flex:1}
.j-head{display:flex;gap:18px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;box-shadow:inset 0 1px 0 var(--hl),0 4px 18px -6px var(--shadow);margin-bottom:16px}
.j-head h1{font-size:26px;line-height:1.2;margin:0 0 6px;overflow-wrap:anywhere}
.j-sub{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);margin-bottom:10px}
.j-sub span{display:inline-flex;gap:6px;align-items:center}
.j-badges{display:flex;gap:6px;flex-wrap:wrap}
.j-head .score{width:62px;height:62px;font-size:20px} .j-head .score::before{inset:5px}
.j-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:980px){.j-grid{grid-template-columns:1fr}}
.box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;box-shadow:inset 0 1px 0 var(--hl),0 2px 8px -2px var(--shadow)}
.box>h2{margin:0 0 12px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-family:var(--font-mono)}
.facts{display:grid;gap:0}
.fact{display:flex;gap:12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.fact:last-child{border-bottom:0} .fact dt{color:var(--ink-3);display:flex;gap:7px;align-items:center;white-space:nowrap} .fact dd{margin:0;text-align:right;overflow-wrap:anywhere;color:var(--ink)}
.prose{overflow-wrap:anywhere;line-height:1.65;font-size:14.5px}
.prose h3,.prose h4,.prose h5{font-family:var(--font-head);margin:1.3em 0 .4em;font-weight:500} .prose h3{font-size:18px}
.prose p{margin:.7em 0} .prose ul,.prose ol{padding-left:1.4em;margin:.6em 0} .prose li{margin:.25em 0}
.prose table{border:1px solid var(--border);border-radius:8px;margin:.8em 0;font-size:13.5px} .prose pre{white-space:pre-wrap;background:var(--field);padding:10px 12px;border-radius:10px;font:12.5px/1.5 var(--font-mono)}
.prose.plain{white-space:pre-wrap}
.reasons{margin:0;padding:0;list-style:none;display:grid;gap:6px} .reasons li{display:flex;gap:8px;color:var(--ink-2);font-size:13.5px}
.reasons li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.timeline{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.timeline .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.timeline .cur .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.timeline b{font-weight:600} .timeline small{color:var(--ink-3);display:block}
.json{max-height:420px;overflow:auto;background:var(--field);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;font:12px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.notice{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--border));background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:8px;font-size:12px;display:none;z-index:9;max-width:320px}
details.sec{border:1px solid var(--grid);border-radius:var(--r-md);margin-bottom:10px;background:var(--surface-2)}
details.sec>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none} details.sec[open]>summary .chev{transform:rotate(180deg)} details.sec>div{padding:0 16px 14px}
@media print{body{background:#fff;color:#000} .btn,.crumbs,.panel-h .chev{display:none!important} .box,.j-head{box-shadow:none;border-color:#ccc}}
</style>

      </div>

        <label class="rng">Nota mínima <input type="range" id="fScore" min="0" max="100" step="5" value="0"> <b id="fScoreV">0</b></label>

  </details>

</main>

<!-- ===================================================== página da vaga -->
<main id="viewJob" hidden></main>
</div>

<!--__RECORDS__-->
<script>
// O WebView2 (via System.Uri do .NET) escapa o fragmento: "#embed|#/linkedin" chega como "#embed%7C%23/linkedin".
// Por isso o fragmento é sempre decodificado antes de comparar; sem isso o modo embutido nunca ligava no app.
const hashNow = () => { try { return decodeURIComponent(location.hash); } catch (e) { return location.hash; } };
if (hashNow().startsWith("#embed|")) {          // aberto dentro do app: "#embed|#/linkedin" (a rota vem depois do "|")
  document.documentElement.dataset.embed = "1";
  history.replaceState(null, "", hashNow().slice(7) || "#/");
}
// O app pede um painel regenerado (nova atualização/importação) com `load_url(arquivo#embed|<rota>)`. Como só o
// fragmento muda, o navegador não recarrega a página; aqui ela mesma se recarrega para ler os dados novos.
window.addEventListener("hashchange", () => { if (hashNow().startsWith("#embed|")) location.reload(); });
const DATA = /*__DATA__*/null;
const TECH = {SALESFORCE:"Salesforce",AWS:"AWS",GO:"Go",PYTHON:"Python",TYPESCRIPT_NODE:"TypeScript/Node",ANGULAR_REACT:"Angular/React",GRAPHQL:"GraphQL",AI_GENAI:"IA/GenAI",INTEGRATION_ARCH:"Integração",JAVA:"Java",DOTNET:".NET"};
const VERD = {ELIGIBLE:"Elegível",MAYBE:"Talvez",BLOCKED:"Bloqueada"};
const VORD = {ELIGIBLE:0,MAYBE:1,BLOCKED:2};
const WORK = {remote:"Remoto",hybrid:"Híbrido",onsite:"Presencial"};
const COMMIT = {FullTime:"Tempo integral",PartTime:"Meio período",Contract:"Contrato",Intern:"Estágio",Temporary:"Temporário"};
const SRC = {greenhouse:"Greenhouse",lever:"Lever",ashby:"Ashby",gupy:"Gupy",workday:"Workday",stone_portal:"Portal Stone",linkedin:"LinkedIn (importado)"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const parseDate = iso => { const d = new Date(iso); return isNaN(d) ? null : d; };
const fmtDate = iso => { const d = parseDate(iso); return d ? d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : (iso || "—"); };
const fmtDay = iso => { const d = parseDate(iso); return d ? d.toLocaleDateString("pt-BR",{dateStyle:"medium"}) : (iso || "—"); };
const ago = iso => { const d = parseDate(iso); if(!d) return ""; const n = Math.floor((Date.now()-d)/864e5);
  return n<=0 ? "hoje" : n===1 ? "ontem" : n<30 ? `há ${n} dias` : n<365 ? `há ${Math.floor(n/30)} ${Math.floor(n/30)>1?"meses":"mês"}` : `há ${Math.floor(n/365)} ano${n>=730?"s":""}`; };
const store = { get(k, d){ try { const v = localStorage.getItem("v1000."+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem("v1000."+k, JSON.stringify(v)); } catch(e){} } };
const state = {sortK:"score", techs:new Set(), shown:60, view:store.get("view","cards")};
const PAGE = 60;
const jobs = DATA.jobs, byKey = Object.fromEntries(jobs.map(j => [j.key, j]));
const open = jobs.filter(j => j.status === "open");
const tipEl = $("#tip");

/* ---------- tema ---------- */
const themes = ["auto","light","dark"]; let ti = Math.max(0, themes.indexOf(store.get("theme","auto")));
function applyTheme(){ const t = themes[ti];
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = "Tema: " + {auto:"automático",light:"claro",dark:"escuro"}[t]; store.set("theme", t); }
$("#theme").onclick = () => { ti = (ti+1) % 3; applyTheme(); }; applyTheme();

/* ---------- cabeçalho e KPIs ---------- */
const last = DATA.runs[0];
$("#sub").textContent = last ? `Execução #${last.run_id} em ${fmtDate(last.started_at)} · ${jobs.length.toLocaleString("pt-BR")} vagas guardadas` : "Nenhuma execução ainda";
const elig = open.filter(j => j.verdict === "ELIGIBLE").length;
const kpi = (n, l, cls = "", tip = "") => `<div class="kpi ${cls}"${tip ? ` title="${tip}"` : ""}><b>${n.toLocaleString("pt-BR")}</b><span>${l}</span></div>`;
$("#kpis").innerHTML = kpi(open.length,"vagas abertas") + kpi(elig,"elegíveis","hot","Vagas abertas que passam no seu perfil") +
  kpi(open.filter(j=>j.is_new).length,"novas na execução","","Novas na última execução");
const nCos = DATA.companies.filter(c => !c.imported).length, nClosed = jobs.length - open.length;
const badCo = new Set(DATA.companies.filter(c => c.ok === false).map(c => c.company_id));       // fonte que não respondeu na última leitura
const nUnv = open.filter(j => badCo.has(j.company_id)).length;
$("#kpiMeta").textContent = `${nClosed.toLocaleString("pt-BR")} encerradas guardadas · ${nCos.toLocaleString("pt-BR")} empresas` +
  (badCo.size ? ` · ${nUnv.toLocaleString("pt-BR")} das vagas abertas são de ${badCo.size} fonte${badCo.size > 1 ? "s" : ""} sem leitura na última execução (guardadas, não verificadas)` : "");

/* ---------- painéis recolhíveis ---------- */
function setPanel(id, openIt){
  const p = $("#"+id); p.dataset.open = openIt; p.querySelector(".panel-h").setAttribute("aria-expanded", openIt);
  p.querySelector(".full").hidden = !openIt; store.set("panel."+id, openIt);
}
document.querySelectorAll(".panel").forEach(p => {
  p.querySelector(".panel-h").onclick = () => setPanel(p.id, p.dataset.open !== "true");
  setPanel(p.id, store.get("panel."+p.id, false));
});
const sum = v => v.ELIGIBLE + v.MAYBE + v.BLOCKED;
const stat = (dot, txt) => `<span class="stat"><i style="background:${dot}"></i>${txt}</span>`;

/* fontes */
(function(){
  const cs = DATA.companies;
  const nCo = cs.filter(c => !c.imported).length;
  const ok = cs.filter(c => c.ok === true && c.count > 0), zero = cs.filter(c => c.ok === true && !c.count),
        err = cs.filter(c => c.ok === false), nodata = cs.filter(c => c.ok === null);
  const nNodata = nodata.filter(c => !c.imported).length;
  $("#sumSources").textContent = `${nCo} empresas · ${ok.length} com vagas` + (err.length ? ` · ${err.length} com erro` : "") + (nNodata ? ` · ${nNodata} sem leitura` : "");
  let f = "all";
  const draw = () => { const q = $("#srcQ").value.trim().toLowerCase();
    $("#srcGrid").innerHTML = cs.filter(c => (f==="all" || (f==="err"&&c.ok===false) || (f==="zero"&&c.ok===true&&!c.count)) && (!q || c.name.toLowerCase().includes(q)))
      .map(c => `<div class="src ${c.ok===false?"err":c.ok&&!c.count?"zero":c.ok===null?"nodata":""}" title="${esc(c.error||(c.ok===null?"Sem leitura na última execução":""))}"><i></i><b>${esc(c.name)}</b>${c.ok===false?`<span class="e">${esc(c.error||"erro")}</span>`:""}<span class="n">${c.ok===null?"—":c.ok?c.count:"✕"}</span></div>`).join("") || '<div class="muted">Nenhuma fonte com esse filtro.</div>'; };
  $("#srcQ").oninput = draw;
  $("#srcF").onclick = e => { const b = e.target.closest("[data-f]"); if(!b) return; f = b.dataset.f; document.querySelectorAll("#srcF button").forEach(x => x.setAttribute("aria-pressed", x===b)); draw(); };
  draw();
})();

/* vagas por empresa */
const byC = {}; open.forEach(j => { (byC[j.company] ||= {ELIGIBLE:0,MAYBE:0,BLOCKED:0})[j.verdict]++; });
const col = {ELIGIBLE:"var(--v-elig)",MAYBE:"var(--v-maybe)",BLOCKED:"var(--v-block)"};
const rowC = (c, v, max) => `<div class="barrow click" data-co="${esc(c)}"><span class="lbl">${esc(c)}</span><div class="track">` +
  ["ELIGIBLE","MAYBE","BLOCKED"].filter(k=>v[k]).map(k => `<div class="seg1" data-t="${esc(c)} · ${VERD[k]}: ${v[k]}" style="width:${v[k]/max*100}%;background:${col[k]}"></div>`).join("") +
  `</div><span class="num">${sum(v)}</span></div>`;
(function(){
  const all = Object.entries(byC), tot = all.reduce((a,[,v]) => a + sum(v), 0), maxAll = Math.max(1, ...all.map(([,v]) => sum(v)));

  $("#miniCompany").innerHTML = ["ELIGIBLE","MAYBE","BLOCKED"].map(k => `<i style="width:${dist[k]/(tot||1)*100}%;background:${col[k]}"></i>`).join("");

const recCache = {};
function rec(j){ if (!recCache[j.rid]) { const el = document.getElementById("rec-"+j.rid); recCache[j.rid] = el ? JSON.parse(el.textContent) : {}; } return recCache[j.rid]; }
const plain = h => String(h||"").replace(/<[^>]+>/g," ");
function filtered(){
  const q = $("#q").value.trim().toLowerCase(), c = $("#fCompany").value, v = $("#fVerdict").value, w = $("#fWork").value,
        min = +$("#fScore").value, onlyNew = $("#fNew").checked, onlyIntl = $("#fIntl").checked, closed = $("#fClosed").checked, inDesc = $("#fDesc").checked;
  return jobs.filter(j =>
    (closed || j.status === "open") && (!c || j.company === c) &&
    (v === "ALL" || (v === "E" ? j.verdict === "ELIGIBLE" : j.verdict !== "BLOCKED")) &&
    (!w || j.workplace === w) && j.score >= min && (!onlyNew || j.is_new) && (!onlyIntl || j.intl) &&
    (!state.techs.size || j.techs.some(t => state.techs.has(t))) &&
    (!q || (j.title+" "+j.company+" "+j.location+" "+j.area+" "+j.team).toLowerCase().includes(q) ||
       (inDesc && q.length > 2 && (() => { const r = rec(j); return ((r.description||"") + plain(r.description_html)).toLowerCase().includes(q); })())));
}
function sorted(rows){
  const k = $("#fSort").value;
  const cmp = { score:(a,b) => b.score-a.score, recent:(a,b) => String(b.first_seen).localeCompare(a.first_seen) || b.score-a.score,
    posted:(a,b) => String(b.posted_at||"").localeCompare(a.posted_at||"") || b.score-a.score, company:(a,b) => a.company.localeCompare(b.company,"pt-BR") || b.score-a.score }[k];
  return rows.sort(state.view === "table" && state.sortK !== "score" ? tableCmp : cmp);
}
let tableDir = -1;
const tableCmp = (a,b) => { const k = state.sortK; let x = a[k], y = b[k]; if (k==="verdict"){ x=VORD[x]; y=VORD[y]; }
  const r = typeof x === "number" ? x-y : String(x??"").localeCompare(String(y??""),"pt-BR"); return (r || b.score-a.score) * tableDir; };

function card(j){
  const sal = j.salary ? `<span class="chip sal">${ic("cash")} ${esc(j.salary)}</span>` : "";
  const posted = j.posted_at ? `<span>${ic("cal")} Publicada ${ago(j.posted_at)}</span>` : "";
  const ct = COMMIT[j.commitment] || j.commitment;
  const wp = j.workplace && WORK[j.workplace] && !String(j.location).toLowerCase().includes(WORK[j.workplace].toLowerCase().slice(0,5)) ? WORK[j.workplace] : "";
  return `<a class="card ${j.status==="closed"?"closed":""}" href="#/vaga/${encodeURIComponent(j.key)}">
    <div class="c-top"><div class="tile">${esc(j.company.slice(0,1).toUpperCase())}</div><div class="c-co"><b>${esc(j.company)}</b><span>${esc(j.area||j.team||"")}</span></div>
      <div class="score" style="--p:${Math.round(j.score)}" data-t="Nota ${j.score.toFixed(0)} de 100"><span>${j.score.toFixed(0)}</span></div></div>
    <h3 class="c-title">${esc(j.title)}</h3>
    <div class="c-meta"><span>${ic("pin")}${esc(j.location||"Local não informado")}${j.nloc>1?` <span class="muted">+${j.nloc-1}</span>`:""}</span>
      ${wp?`<span>${ic("globe")}${wp}</span>`:""}${ct?`<span>${ic("brief")}${esc(ct)}</span>`:""}${posted}</div>
    <div class="c-chips">${sal}${j.techs.slice(0,4).map(t => `<span class="chip">${esc(TECH[t]||t)}</span>`).join("")}</div>
    <div class="c-foot"><span class="badge b-${j.verdict}">${VERD[j.verdict]||j.verdict}</span>${j.is_new?'<span class="badge b-new">Nova</span>':""}${j.status==="closed"?'<span class="badge b-closed">Encerrada</span>':""}
      ${j.versions>1?`<span class="badge b-n" data-t="A fonte editou esta vaga ${j.versions-1}×">v${j.versions}</span>`:""}<span class="when">vista ${ago(j.first_seen)}</span></div></a>`;
}
function render(){
  updateAdv();
  const rows = sorted(filtered()), total = rows.length, shown = rows.slice(0, state.shown);
  $("#count").textContent = `${total.toLocaleString("pt-BR")} de ${jobs.length.toLocaleString("pt-BR")}`;
  $("#empty").hidden = total > 0; $("#moreWrap").hidden = total <= shown.length;
  $("#more").textContent = `Carregar mais (${(total - shown.length).toLocaleString("pt-BR")} restantes)`;
  document.querySelectorAll("#viewSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view));
  if (state.view === "cards") { $("#out").innerHTML = `<div class="cards">${shown.map(card).join("")}</div>`; return; }
  const th = (k,l) => `<th data-k="${k}" tabindex="0" title="Ordenar por ${l.toLowerCase()}" ${state.sortK===k?`aria-sort="${tableDir===1?"ascending":"descending"}"`:""}>${l}</th>`;
  $("#out").innerHTML = `<div class="tablewrap"><table><thead><tr>${th("score","Nota")}${th("verdict","Veredito")}${th("company","Empresa")}${th("title","Vaga")}${th("location","Local")}<th>Tecnologias</th>${th("first_seen","Vista em")}</tr></thead><tbody>` +
    shown.map(j => `<tr class="row" data-go="${esc(j.key)}"><td class="sc"><span class="scbar" style="width:${Math.max(2,j.score*0.4)}px"></span>${j.score.toFixed(0)}</td>
      <td><span class="badge b-${j.verdict}">${VERD[j.verdict]||j.verdict}</span></td><td>${esc(j.company)}</td>
      <td>${esc(j.title)}${j.is_new?' <span class="badge b-new">Nova</span>':""}${j.status==="closed"?' <span class="badge b-closed">Encerrada</span>':""}</td>
      <td>${esc(j.location)}<div class="muted">${esc(WORK[j.workplace]||"")}</div></td><td>${j.techs.map(t=>esc(TECH[t]||t)).join(", ")}</td><td class="muted">${fmtDate(j.first_seen)}</td></tr>`).join("") + "</tbody></table></div>";
}
$("#out").addEventListener("keydown", e => {              // cabeçalho de coluna acessível pelo teclado
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("th[data-k]")) { e.preventDefault(); e.target.click(); } });
$("#out").addEventListener("click", e => {
  const th = e.target.closest("th[data-k]"); if (th) { const k = th.dataset.k; tableDir = state.sortK === k ? -tableDir : (k==="score"||k==="first_seen" ? -1 : 1); state.sortK = k; render(); return; }
  const tr = e.target.closest("tr[data-go]"); if (tr) location.hash = "#/vaga/" + encodeURIComponent(tr.dataset.go); });
$("#runs").innerHTML = DATA.runs.map(r => `<tr><td>${r.run_id}</td><td>${fmtDate(r.started_at)}</td><td>${r.total}</td><td>${r.eligible}</td><td>${r.new_count}</td><td>${r.closed_count}</td></tr>`).join("");

/* ---------- aba LinkedIn (captura manual) ---------- */
const liJobs = jobs.filter(j => j.li);
const FIT = ["Alta","Média","Baixa"], fitRank = s => { const i = FIT.indexOf(s); return i < 0 ? 3 : i; };
const FIT_BADGE = {"Alta":"b-ELIGIBLE","Média":"b-MAYBE","Baixa":"b-BLOCKED"};
const liState = {fit:""};
const applicantsN = s => { const m = String(s||"").match(/\d+/); return m ? +m[0] : 9999; };
$("#nAll").textContent = open.length.toLocaleString("pt-BR");
$("#nLi").textContent = liJobs.length.toLocaleString("pt-BR");
(function(){
  const stamp = liJobs.map(j => j.first_seen).sort().pop();
  $("#liNote").innerHTML = liJobs.length
    ? `Vagas captadas à mão pelo Claude no Chrome (busca de Salesforce) e importadas para o banco${stamp ? ` em ${esc(fmtDay(stamp))}` : ""}. Clique numa linha para ver senioridade, requisitos, observações e a descrição completa da vaga.`
    : `Ainda não há vagas do LinkedIn. Use <b>Importar vagas</b> na janela do app (ou <code>python main.py --importar arquivo</code>) com a planilha da captura manual.`;
  const cnt = k => liJobs.filter(j => !k || j.li.fit === k).length;
  $("#liFit").innerHTML = [["", "Todas"], ...FIT.map(f => [f, f])].map(([k,l]) =>
    `<button type="button" data-f="${k}" aria-pressed="${k===liState.fit}">${l} <span class="muted">${cnt(k)}</span></button>`).join("");
})();
function liRows(){
  const q = $("#liQ").value.trim().toLowerCase(), w = $("#liWork").value, k = $("#liSort").value;
  const rows = liJobs.filter(j => (!liState.fit || j.li.fit === liState.fit) && (!w || j.workplace === w) &&
    (!q || (j.title+" "+j.company+" "+j.location+" "+j.li.seniority+" "+j.li.notes+" "+plain(rec(j).description_html)).toLowerCase().includes(q)));
  const cmp = { fit:(a,b) => fitRank(a.li.fit) - fitRank(b.li.fit) || b.score - a.score,
    score:(a,b) => b.score - a.score, company:(a,b) => a.company.localeCompare(b.company,"pt-BR") || fitRank(a.li.fit) - fitRank(b.li.fit),
    applicants:(a,b) => applicantsN(a.li.applicants) - applicantsN(b.li.applicants) || fitRank(a.li.fit) - fitRank(b.li.fit) }[k];
  return rows.sort(cmp);
}
function liRender(){
  document.querySelectorAll("#liFit button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === liState.fit));
  const rows = liRows();
  $("#liCount").textContent = `${rows.length} de ${liJobs.length}`;
  $("#liEmpty").hidden = rows.length > 0 || !liJobs.length; $("#liEmpty").textContent = "Nenhuma vaga com esses filtros.";
  $("#liOut").innerHTML = !rows.length ? "" : `<div class="tablewrap"><table class="li-table"><thead><tr><th>Aderência</th><th>Vaga</th><th>Local</th><th>Modelo</th><th>Publicada</th><th>Candidaturas</th><th>Link</th></tr></thead><tbody>` +
    rows.map(j => { const l = j.li;
      const model = [WORK[j.workplace], COMMIT[j.commitment] || j.commitment].filter(Boolean).join(" · ");
      const sub = [j.company, l.seniority].filter(Boolean).join(" · ");     // requisitos e descrição ficam na página da vaga
      return `<tr class="row" data-go="${esc(j.key)}"><td><span class="badge ${FIT_BADGE[l.fit]||"b-n"}">${esc(l.fit||"—")}</span></td>
        <td class="ttl"><b>${esc(j.title)}</b><div>${esc(sub)}</div>${l.notes ? `<div class="obs1" title="${esc(l.notes)}">${esc(l.notes)}</div>` : ""}</td><td>${esc(j.location)}</td><td>${esc(model)}</td>
        <td class="muted">${esc(l.posted || (j.posted_at ? ago(j.posted_at) : ""))}</td><td class="muted">${esc(l.applicants)}</td>
        <td>${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer" data-ext>abrir</a>` : ""}</td></tr>`; }).join("") + "</tbody></table></div>";
}
$("#liFit").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; liState.fit = b.dataset.f; liRender(); };
["liQ","liWork","liSort"].forEach(id => $("#"+id).addEventListener("input", liRender));

const fact = (icon, label, val) => val || val === 0 ? `<div class="fact"><dt>${ic(icon)}${label}</dt><dd>${val}</dd></div>` : "";
const dateFact = iso => iso ? `${esc(fmtDay(iso))} <span class="muted">(${ago(iso)})</span>` : "";
let homeScroll = 0, viewing = null;
function jobRecord(j, ver){
  const r = rec(j); if (!ver || !ver.data) return {...j, ...r, _cur:true};
  const d = ver.data; return {...j, ...r, ...d, salary: d.salary_text, workplace: d.workplace_type, _cur:false};
}
function showJob(key, verN){
  const j = byKey[key];
  if (!j) { location.hash = "#/"; return; }
  const r0 = rec(j), vers = r0.versions || [];
  const ver = verN ? vers.find(v => v.n === verN) : null, R = jobRecord(j, ver);

  const meta = Object.entries(R.metadata || {}).filter(([,v]) => v !== "" && v !== null && v !== undefined).map(([k,v]) => fact("tag", esc(k), esc(typeof v === "object" ? JSON.stringify(v) : v))).join("");
  const locs = (R.locations && R.locations.length ? R.locations : [j.location]).filter(Boolean);
  $("#viewJob").innerHTML = `
    <div class="crumbs"><a class="btn" href="#/" id="back">${ic("back")}Voltar às vagas</a><span class="sp"></span>

    ${ver && !ver._cur ? `<div class="notice"><b>Versão ${ver.n} de ${vers.length}</b> · como a vaga estava em ${esc(fmtDate(ver.seen_at))}. <a href="#/vaga/${encodeURIComponent(key)}">Ver a versão atual</a></div>` : ""}
    <div class="j-head"><div class="tile lg">${esc(j.company.slice(0,1).toUpperCase())}</div>
      <div style="flex:1;min-width:0"><div class="sub">${esc(j.company)}</div><h1>${esc(R.title || j.title)}</h1>

          ${(R.commitment||j.commitment)?`<span>${ic("brief")}${esc(COMMIT[R.commitment||j.commitment]||R.commitment||j.commitment)}</span>`:""}${sal?`<span>${ic("cash")}${esc(sal)}</span>`:""}</div>

          ${j.techs.map(t => `<span class="chip">${esc(TECH[t]||t)}</span>`).join("")}</div></div>
      <div class="score" style="--p:${Math.round(j.score)}" data-t="Nota ${j.score.toFixed(0)} de 100"><span>${j.score.toFixed(0)}</span></div></div>
    <div class="j-grid"><div>
      <div class="box"><h2>Descrição completa</h2>${html ? `<div class="prose">${html}</div>` : (R.description ? `<div class="prose plain">${esc(R.description)}</div>` : '<div class="muted">Esta vaga foi guardada sem descrição. Ela será completada na próxima atualização, se a fonte ainda a publicar.</div>')}</div>

      <div class="box"><h2>Resumo</h2><dl class="facts">
        ${fact("build","Empresa",esc(j.company))}${fact("pin","Local",esc(locs.join(" · ")))}${fact("globe","Modalidade",esc(WORK[R.workplace||j.workplace]||""))}
        ${fact("brief","Contrato",esc(COMMIT[R.commitment||j.commitment]||R.commitment||j.commitment||""))}${fact("layers","Área",esc(R.area||j.area||""))}${fact("layers","Time",esc(R.team||j.team||""))}
        ${fact("cash","Salário",esc(sal))}${fact("cal","Publicada",dateFact(R.posted_at||j.posted_at))}${fact("cal","Atualizada na fonte",dateFact(r0.updated_at))}${fact("cal","Inscrições até",dateFact(R.deadline||r0.deadline))}
        ${fact("hash","Requisição",esc(R.requisition_id||r0.requisition_id||""))}${fact("hash","ID na fonte",esc(r0.job_id))}${fact("tag","Fonte",esc(SRC[r0.source]||r0.source))}
      </dl></div>
      <div class="box"><h2>No seu banco</h2><dl class="facts">
        ${fact("clock","Vista pela 1ª vez",esc(fmtDate(j.first_seen)))}${fact("clock","Última vez vista",esc(fmtDate(j.last_seen)))}
        ${j.status==="closed"?fact("clock","Encerrada em",esc(j.closed_at?fmtDate(j.closed_at):"—")):""}${fact("clock","Detalhe lido em",esc(r0.detail_at?fmtDate(r0.detail_at):""))}${fact("layers","Versões guardadas",String(j.versions))}</dl></div>
      <div class="box"><h2>Histórico de versões</h2>${vers.length > 1 ? `<ul class="timeline">${[...vers].reverse().map((v,i) => `<li class="${i===0?"cur":""}"><span class="dot"></span><div><b>Versão ${v.n}${i===0?" (atual)":""}</b><small>${esc(fmtDate(v.seen_at))}</small>${esc((v.changes||[]).join(", "))}${v.data?` · <a href="#/vaga/${encodeURIComponent(key)}/v${v.n}">ver esta versão</a>`:""}</div></li>`).join("")}</ul>` :
        '<div class="muted">Sem edições desde que a vaga foi guardada. Se a fonte alterar o texto, o salário ou o local, a versão anterior continua aqui.</div>'}</div>
      ${meta ? `<div class="box"><h2>Metadados da fonte</h2><dl class="facts">${meta}</dl></div>` : ""}
    </div></div>`;
  $("#back").onclick = e => { if (history.length > 1) { e.preventDefault(); history.back(); } };
  $("#copyLink").onclick = async () => { const u = j.url || location.href; try { await navigator.clipboard.writeText(u); $("#copyLink").lastChild.textContent = "Copiado"; } catch(e){ prompt("Copie o link:", u); } };
  $("#dlRec").onclick = () => { const blob = new Blob([JSON.stringify({vaga:j, registro:rec(j)}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `vaga-${j.key.replace(/[^\w.-]+/g,"_")}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  $("#loadRaw").onclick = async () => { const box = $("#rawBox"); box.innerHTML = '<span class="muted">Carregando…</span>';
    const api = window.pywebview && window.pywebview.api;
    if (api && api.get_raw) { try { const raw = await api.get_raw(key); box.innerHTML = raw ? `<div class="json">${esc(JSON.stringify(raw, null, 2))}</div>` : '<div class="muted">Esta vaga ainda não tem payload bruto (será guardado na próxima atualização).</div>'; return; } catch(e){} }
    box.innerHTML = `<div class="muted">${r0.has_raw ? "O payload bruto está guardado no banco, mas o arquivo do painel não o carrega (pesaria dezenas de MB). Abra o painel pelo app, ou rode <code>python main.py --exportar</code> e use <code>out/banco-vagas.json</code>." : "Esta vaga ainda não tem payload bruto: ele é guardado a partir da próxima atualização."}</div>`; };
}
function route(){
  const h = location.hash, m = h.match(/^#\/vaga\/(.+?)(?:\/v(\d+))?$/);
  if (m) { if (!viewing) homeScroll = window.scrollY; viewing = decodeURIComponent(m[1]);
    $("#viewHome").hidden = true; $("#viewJob").hidden = false; showJob(viewing, m[2] ? +m[2] : 0); window.scrollTo(0, 0); }
  else { $("#viewJob").hidden = true; $("#viewHome").hidden = false; const was = viewing; viewing = null;
    setTab(h === "#/linkedin" ? "li" : h === "#/" ? "all" : store.get("tab", "all")); if (was) window.scrollTo(0, homeScroll); }
}
window.addEventListener("hashchange", route); route();
</script>
</body>
