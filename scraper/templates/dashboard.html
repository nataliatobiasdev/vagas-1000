<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de vagas</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --surface-2:#f4f3f0; --border:#e2e0da; --grid:#ece9e3;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#77756f;
  --accent:#2a78d6; --accent-soft:#cde2fb;
  --v-elig:#2a78d6; --v-maybe:#86b6ef; --v-block:#c9c7c0;
  --bar:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface:#1a1a19; --surface-2:#232321; --border:#383835; --grid:#2d2d2b;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9a998f;
    --accent:#3987e5; --accent-soft:#0d366b;
    --v-elig:#3987e5; --v-maybe:#184f95; --v-block:#4a4a46;
    --bar:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1a1a19; --surface-2:#232321; --border:#383835; --grid:#2d2d2b;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9a998f;
  --accent:#3987e5; --accent-soft:#0d366b;
  --v-elig:#3987e5; --v-maybe:#184f95; --v-block:#4a4a46;
  --bar:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:600}
.sub{color:var(--ink-2);font-size:13px}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink-2);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barrow{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.barrow .lbl{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .num{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.track{display:flex;height:14px;gap:2px}
.seg{height:100%;min-width:0;border-radius:0 4px 4px 0;cursor:default}
.seg:first-child{border-radius:0 4px 4px 0}
.single{height:14px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.err{border-color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.filters input[type=search],.filters select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
.filters input[type=search]{min-width:220px}
.filters label{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13px}
.techs{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 10px}
.tg{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.tg[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th[aria-sort=ascending]::after{content:" ▲"} th[aria-sort=descending]::after{content:" ▼"}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
td.sc{white-space:nowrap;font-variant-numeric:tabular-nums;width:92px}
.scbar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--bar);vertical-align:middle;margin-right:6px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-ELIGIBLE{background:var(--v-elig);color:#fff}
.b-MAYBE{background:var(--surface);border-color:var(--v-elig);color:var(--ink)}
.b-BLOCKED{background:var(--surface);border-color:var(--border);color:var(--ink-3)}
.new{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:6px;font-size:11px;padding:0 6px;margin-left:6px;font-weight:600}
.closed{color:var(--ink-3);text-decoration:line-through}
.detail td{background:var(--surface-2);padding:12px 14px}
.detail .why{color:var(--ink-2);margin:0 0 8px}
.detail pre{white-space:pre-wrap;font:inherit;color:var(--ink);margin:0;max-height:260px;overflow:auto}
a{color:var(--accent)}
.muted{color:var(--ink-3)}
.empty{padding:26px;text-align:center;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px;margin:16px 0 8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:6px;font-size:12px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Painel de vagas</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="btn" id="theme" type="button">Tema: automático</button>
  </header>

  <section class="kpis" id="kpis"></section>
  <section class="card" style="margin-bottom:16px"><h2>Fontes na última execução</h2><div class="status" id="status"></div></section>

  <section class="grid2">
    <div class="card"><h2>Vagas por empresa e veredito</h2>
      <div class="legend"><span><i style="background:var(--v-elig)"></i>Elegível</span><span><i style="background:var(--v-maybe)"></i>Talvez</span><span><i style="background:var(--v-block)"></i>Bloqueada</span></div>
      <div id="chartCompany"></div></div>
    <div class="card"><h2>Tecnologias nas vagas elegíveis</h2><div id="chartTech"></div></div>
  </section>

  <section>
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar título, empresa, local…" aria-label="Buscar">
      <select id="fCompany" aria-label="Empresa"></select>
      <select id="fVerdict" aria-label="Veredito">
        <option value="EM">Elegíveis + Talvez</option><option value="E">Só elegíveis</option><option value="ALL">Todas</option>
      </select>
      <select id="fWork" aria-label="Modalidade"><option value="">Qualquer modalidade</option><option value="remote">Remoto</option><option value="hybrid">Híbrido</option><option value="onsite">Presencial</option></select>
      <label>Nota ≥ <input type="range" id="fScore" min="0" max="100" step="5" value="0"> <b id="fScoreV">0</b></label>
      <label><input type="checkbox" id="fNew"> Só novas</label>
      <label><input type="checkbox" id="fIntl"> Só internacionais</label>
      <label><input type="checkbox" id="fClosed"> Mostrar encerradas</label>
      <span class="sub" id="count"></span>
    </div>
    <div class="techs" id="techChips" aria-label="Filtrar por tecnologia"></div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th data-k="score" aria-sort="descending">Nota</th><th data-k="verdict">Veredito</th><th data-k="company">Empresa</th>
        <th data-k="title">Vaga</th><th data-k="location">Local</th><th>Tecnologias</th><th data-k="first_seen">Vista em</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="empty" id="empty" hidden>Nenhuma vaga com esses filtros.</div>
  </section>

  <details><summary>Histórico de execuções</summary>
    <table><thead><tr><th>#</th><th>Quando</th><th>Vagas</th><th>Elegíveis</th><th>Novas</th><th>Encerradas</th></tr></thead><tbody id="runs"></tbody></table>
  </details>
</div>
<div class="tip" id="tip"></div>

<script>
const DATA = /*__DATA__*/null;
const TECH = {SALESFORCE:"Salesforce",AWS:"AWS",GO:"Go",PYTHON:"Python",TYPESCRIPT_NODE:"TypeScript/Node",ANGULAR_REACT:"Angular/React",GRAPHQL:"GraphQL",AI_GENAI:"IA/GenAI",INTEGRATION_ARCH:"Integração",JAVA:"Java",DOTNET:".NET"};
const VERD = {ELIGIBLE:"Elegível",MAYBE:"Talvez",BLOCKED:"Bloqueada"};
const VORD = {ELIGIBLE:0,MAYBE:1,BLOCKED:2};
const WORK = {remote:"Remoto",hybrid:"Híbrido",onsite:"Presencial"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => { try { return new Date(iso).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); } catch(e){ return iso; } };
const state = {sortK:"score", sortDir:-1, techs:new Set(), open:new Set()};

const jobs = DATA.jobs;
const open = jobs.filter(j => j.status === "open");

/* ---------- tema ---------- */
const themes = ["auto","light","dark"]; let ti = 0;
$("#theme").onclick = () => {
  ti = (ti+1) % 3; const t = themes[ti];
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = "Tema: " + {auto:"automático",light:"claro",dark:"escuro"}[t];
};

/* ---------- cabeçalho e KPIs ---------- */
const last = DATA.runs[0];
$("#sub").textContent = last ? `Execução #${last.run_id} em ${fmtDate(last.started_at)} · painel gerado em ${fmtDate(DATA.generated_at)}` : "Nenhuma execução ainda";
const elig = open.filter(j => j.verdict === "ELIGIBLE").length;
const closedNow = last ? last.closed_count : 0;
const kpi = (n, l) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`;
$("#kpis").innerHTML = kpi(open.length,"vagas abertas") + kpi(elig,"elegíveis") +
  kpi(open.filter(j=>j.is_new).length,"novas desde a execução anterior") + kpi(closedNow,"encerradas desde a anterior") +
  kpi(DATA.companies.length,"empresas monitoradas");

/* ---------- fontes ---------- */
$("#status").innerHTML = DATA.companies.map(c => {
  const st = c.ok === null ? "sem dados" : c.ok ? `${c.count} vagas` : "ERRO";
  const title = c.error ? ` title="${esc(c.error)}"` : "";
  return `<span class="chip ${c.ok===false?"err":""}"${title}><b>${esc(c.name)}</b> <span class="muted">${c.ok===false?"✕ ":c.ok?"✓ ":""}${st}</span></span>`;
}).join("");

/* ---------- gráficos ---------- */
const tip = $("#tip");
function showTip(e, t){ tip.textContent = t; tip.style.display = "block"; tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px"; }
function hideTip(){ tip.style.display = "none"; }
function drawCompany(){
  const byC = {}; open.forEach(j => { (byC[j.company] ||= {ELIGIBLE:0,MAYBE:0,BLOCKED:0})[j.verdict]++; });
  const max = Math.max(1, ...Object.values(byC).map(v => v.ELIGIBLE+v.MAYBE+v.BLOCKED));
  const col = {ELIGIBLE:"var(--v-elig)",MAYBE:"var(--v-maybe)",BLOCKED:"var(--v-block)"};
  $("#chartCompany").innerHTML = Object.entries(byC).sort((a,b)=>sum(b[1])-sum(a[1])).map(([c,v]) =>
    `<div class="barrow"><span class="lbl">${esc(c)}</span><div class="track">` +
    ["ELIGIBLE","MAYBE","BLOCKED"].filter(k=>v[k]).map(k => `<div class="seg" data-t="${esc(c)} · ${VERD[k]}: ${v[k]}" style="width:${v[k]/max*100}%;background:${col[k]}"></div>`).join("") +
    `</div><span class="num">${sum(v)}</span></div>`).join("") || '<div class="muted">Sem dados</div>';
}
function sum(v){ return v.ELIGIBLE+v.MAYBE+v.BLOCKED; }
function drawTech(){
  const cnt = {}; open.filter(j=>j.verdict==="ELIGIBLE").forEach(j => j.techs.forEach(t => cnt[t]=(cnt[t]||0)+1));
  const rows = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10); const max = rows.length ? rows[0][1] : 1;
  $("#chartTech").innerHTML = rows.map(([t,n]) =>
    `<div class="barrow"><span class="lbl">${esc(TECH[t]||t)}</span><div class="track"><div class="single" data-t="${esc(TECH[t]||t)}: ${n} vagas elegíveis" style="width:${n/max*100}%"></div></div><span class="num">${n}</span></div>`).join("") || '<div class="muted">Sem dados</div>';
}
document.addEventListener("mousemove", e => { const t = e.target.closest && e.target.closest("[data-t]"); t ? showTip(e, t.dataset.t) : hideTip(); });
drawCompany(); drawTech();

/* ---------- filtros ---------- */
const companies = [...new Set(jobs.map(j => j.company))].sort();
$("#fCompany").innerHTML = '<option value="">Todas as empresas</option>' + companies.map(c => `<option>${esc(c)}</option>`).join("");
const techCount = {}; jobs.forEach(j => j.techs.forEach(t => techCount[t]=(techCount[t]||0)+1));
$("#techChips").innerHTML = Object.keys(techCount).sort((a,b)=>techCount[b]-techCount[a]).map(t => `<button type="button" class="tg" aria-pressed="false" data-tech="${t}">${esc(TECH[t]||t)} <span class="muted">${techCount[t]}</span></button>`).join("");
$("#techChips").onclick = e => { const b = e.target.closest("[data-tech]"); if(!b) return; const t=b.dataset.tech;
  state.techs.has(t) ? state.techs.delete(t) : state.techs.add(t); b.setAttribute("aria-pressed", state.techs.has(t)); render(); };
["q","fCompany","fVerdict","fWork","fScore","fNew","fIntl","fClosed"].forEach(id => $("#"+id).addEventListener("input", () => { $("#fScoreV").textContent = $("#fScore").value; render(); }));
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; state.sortDir = state.sortK === k ? -state.sortDir : (k==="score"||k==="first_seen" ? -1 : 1); state.sortK = k;
  document.querySelectorAll("th").forEach(x => x.removeAttribute("aria-sort")); th.setAttribute("aria-sort", state.sortDir===1?"ascending":"descending"); render(); });

function filtered(){
  const q = $("#q").value.trim().toLowerCase(), c = $("#fCompany").value, v = $("#fVerdict").value, w = $("#fWork").value,
        min = +$("#fScore").value, onlyNew = $("#fNew").checked, onlyIntl = $("#fIntl").checked, closed = $("#fClosed").checked;
  return jobs.filter(j =>
    (closed || j.status === "open") &&
    (!c || j.company === c) &&
    (v === "ALL" || (v === "E" ? j.verdict === "ELIGIBLE" : j.verdict !== "BLOCKED")) &&
    (!w || j.workplace === w) && j.score >= min && (!onlyNew || j.is_new) && (!onlyIntl || j.intl) &&
    (!state.techs.size || j.techs.some(t => state.techs.has(t))) &&
    (!q || (j.title+" "+j.company+" "+j.location+" "+j.area).toLowerCase().includes(q)));
}
function render(){
  const k = state.sortK, d = state.sortDir;
  const rows = filtered().sort((a,b) => {
    let x = a[k], y = b[k]; if (k==="verdict"){ x=VORD[x]; y=VORD[y]; }
    const r = typeof x === "number" ? x-y : String(x).localeCompare(String(y),"pt-BR");
    return (r || (b.score - a.score)) * (k==="score" ? d : d);
  });
  $("#count").textContent = `${rows.length} de ${jobs.length}`;
  $("#empty").hidden = rows.length > 0;
  $("#tbody").innerHTML = rows.map(j => {
    const isOpen = state.open.has(j.key);
    const title = j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(j.title)}</a>` : esc(j.title);
    return `<tr class="row" data-key="${esc(j.key)}">
      <td class="sc"><span class="scbar" style="width:${Math.max(2,j.score*0.4)}px"></span>${j.score.toFixed(0)}</td>
      <td><span class="badge b-${j.verdict}">${VERD[j.verdict]||j.verdict}</span></td>
      <td>${esc(j.company)}</td>
      <td class="${j.status==="closed"?"closed":""}">${title}${j.is_new?'<span class="new">NOVA</span>':""}${j.status==="closed"?' <span class="muted">(encerrada)</span>':""}</td>
      <td>${esc(j.location)}<div class="muted">${esc(WORK[j.workplace]||"")}</div></td>
      <td>${j.techs.map(t=>esc(TECH[t]||t)).join(", ")}</td>
      <td class="muted">${fmtDate(j.first_seen)}</td></tr>` +
      (isOpen ? `<tr class="detail"><td colspan="7"><p class="why"><b>Por que esta nota:</b> ${esc(j.reasons.join(" · "))}</p><pre>${esc(j.description) || "Sem descrição capturada."}</pre></td></tr>` : "");
  }).join("");
}
$("#tbody").onclick = e => { const tr = e.target.closest("tr.row"); if(!tr) return; const k = tr.dataset.key; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); };
render();

/* ---------- histórico ---------- */
$("#runs").innerHTML = DATA.runs.map(r => `<tr><td>${r.run_id}</td><td>${fmtDate(r.started_at)}</td><td>${r.total}</td><td>${r.eligible}</td><td>${r.new_count}</td><td>${r.closed_count}</td></tr>`).join("");
</script>
</body>
</html>
