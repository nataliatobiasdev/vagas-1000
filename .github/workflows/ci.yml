name: CI

on:
  push:
    branches: [main, 'ci/**']          # ci/**: branches de teste do pipeline, sem precisar abrir PR
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes offline (sem rede, sem Chrome)
        run: python -m unittest discover -s tests -v
      - name: Metadados do executável
        run: python scripts/make_version_info.py
      - name: Empacotar (PyInstaller)
        run: pyinstaller vagas1000.spec --noconfirm
      - name: Teste de fumaça do executável empacotado
        shell: pwsh
        env:
          VAGAS1000_HOME: ${{ runner.temp }}\v1000-home
        run: |
          # o .exe é um app gráfico: o shell não espera por ele, então Start-Process -Wait
          $p = Start-Process -FilePath "dist\vagas1000\vagas1000.exe" -ArgumentList "--scrape","--painel","--no-open" -Wait -PassThru
          Write-Host "código de saída: $($p.ExitCode)"
          $log = Join-Path $env:VAGAS1000_HOME "logs\scraper.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          foreach ($f in "out\dashboard.html", "config\companies.json", "config\profile.json") {
            if (-not (Test-Path (Join-Path $env:VAGAS1000_HOME $f))) { throw "faltou $f" }
          }
      - name: Teste da janela do painel (WebView2) com vagas de demonstração
        shell: pwsh
        env:
          VAGAS1000_HOME: ${{ runner.temp }}\v1000-demo
        run: |
          python scripts/seed_demo.py
          $p = Start-Process -FilePath "dist\vagas1000\vagas1000.exe" -ArgumentList "--janela-painel","--autoteste" `
               -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\autoteste.txt" -RedirectStandardError "$env:RUNNER_TEMP\autoteste.err"
          Get-Content "$env:RUNNER_TEMP\autoteste.txt", "$env:RUNNER_TEMP\autoteste.err" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "autoteste da janela falhou (código $($p.ExitCode))" }
      - name: Teste do painel embutido na janela (WebView2 como janela filha)
        shell: pwsh
        env:
          VAGAS1000_HOME: ${{ runner.temp }}\v1000-demo
        run: |
          $p = Start-Process -FilePath "dist\vagas1000\vagas1000.exe" -ArgumentList "--janela-painel","--autoteste-embutido" `
               -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\embutido.txt" -RedirectStandardError "$env:RUNNER_TEMP\embutido.err"
          $out = (Get-Content "$env:RUNNER_TEMP\embutido.txt", "$env:RUNNER_TEMP\embutido.err" -ErrorAction SilentlyContinue) -join "`n"
          Write-Host $out
          if ($p.ExitCode -ne 0) {
            # o log do Actions exige login; a anotação de erro é pública e traz o diagnóstico
            $msg = if ($out.Length -gt 3000) { $out.Substring($out.Length - 3000) } else { $out }
            $msg = $msg.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=Autoteste do painel embutido::$msg"
            throw "autoteste do painel embutido falhou (código $($p.ExitCode))"
          }
      - name: Instalador Windows (NSIS, por usuário)
        shell: bash
        run: |
          VERSION=$(python -c "from scraper.version import __version__ as v; print(v)")
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" "//DVERSION=$VERSION" installer/vagas1000.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/vagas1000-Setup-*.exe
          if-no-files-found: error
